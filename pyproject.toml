[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ditherer"
version = "0.1.0"
description = "Python-based image/video dithering tool (PySide6 GUI)"
requires-python = ">=3.12"
dependencies = [
    "numba==0.61.2",
    "numpy==2.2.5",
    "opencv_python==4.11.0.86",
    "Pillow==11.2.1",
    "PySide6==6.11.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["media"]

[tool.ruff.format]
quote-style = "double"
